<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A2E"/>
      <stop offset="55%" stop-color="#0F1B1E"/>
      <stop offset="100%" stop-color="#070E10"/>
    </linearGradient>

    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <filter id="bladeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="bevelStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4F52"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bgGradient)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="218" fill="none" stroke="url(#bevelStroke)" stroke-width="2.5"/>

  <!-- Camera aperture iris: 6 rotationally symmetric blades around a center opening -->
  <g filter="url(#bladeShadow)" transform="translate(512 512)">
    <g id="blade" fill="url(#bladeGradient)">
      <path d="M 0 -230 L 155 -95 L 70 -30 L -20 -160 Z"/>
    </g>
    <use href="#blade" transform="rotate(60)"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(180)"/>
    <use href="#blade" transform="rotate(240)"/>
    <use href="#blade" transform="rotate(300)"/>
  </g>
</svg>
