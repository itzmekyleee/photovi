<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Photovi sticker "sunburst" — Sunburst. Drawn onto the strip canvas as an
       Image, so it needs explicit width/height. The keyline filter dilates the
       artwork's alpha into a white die-cut edge, the way a physical sticker
       reads against a photo. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="keyline" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.1" result="spread"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.94" result="white"/>
      <feComposite in="white" in2="spread" operator="in" result="edge"/>
      <feMerge>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#keyline)">
    <g transform="translate(12 12) scale(0.84) translate(-12 -12)">
    <path d="M10.63 4.93L12 0.6L13.37 4.93ZM14.34 5.19L17.7 2.13L16.72 6.57ZM17.43 7.28L21.87 6.3L18.81 9.66ZM19.07 10.63L23.4 12L19.07 13.37ZM18.81 14.34L21.87 17.7L17.43 16.72ZM16.72 17.43L17.7 21.87L14.34 18.81ZM13.37 19.07L12 23.4L10.63 19.07ZM9.66 18.81L6.3 21.87L7.28 17.43ZM6.57 16.72L2.13 17.7L5.19 14.34ZM4.93 13.37L0.6 12L4.93 10.63ZM5.19 9.66L2.13 6.3L6.57 7.28ZM7.28 6.57L6.3 2.13L9.66 5.19Z" fill="url(#g2)"/>
    <circle cx="12" cy="12" r="5.4" fill="url(#g)"/>
    <circle cx="10.2" cy="10.2" r="1.7" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
</svg>
