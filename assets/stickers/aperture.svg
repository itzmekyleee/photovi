<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Photovi sticker "aperture" — Aperture. Drawn onto the strip canvas as an
       Image, so it needs explicit width/height. The keyline filter dilates the
       artwork's alpha into a white die-cut edge, the way a physical sticker
       reads against a photo. -->
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="keyline" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.1" result="spread"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.94" result="white"/>
      <feComposite in="white" in2="spread" operator="in" result="edge"/>
      <feMerge>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#keyline)">
    <g transform="translate(12 12) scale(0.84) translate(-12 -12)">
    <g fill="url(#blade)" transform="translate(12 12)">
      <path id="b" d="M0 -9.6L6.47 -3.97L2.92 -1.25L-0.83 -6.68Z"/>
      <use href="#b" transform="rotate(60)"/>
      <use href="#b" transform="rotate(120)"/>
      <use href="#b" transform="rotate(180)"/>
      <use href="#b" transform="rotate(240)"/>
      <use href="#b" transform="rotate(300)"/>
    </g>
    <circle cx="12" cy="12" r="1.7" fill="#0F172A"/>
    </g>
  </g>
</svg>
