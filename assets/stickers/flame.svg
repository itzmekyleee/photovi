<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Photovi sticker "flame" — Flame. Drawn onto the strip canvas as an
       Image, so it needs explicit width/height. The keyline filter dilates the
       artwork's alpha into a white die-cut edge, the way a physical sticker
       reads against a photo. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="keyline" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.1" result="spread"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.94" result="white"/>
      <feComposite in="white" in2="spread" operator="in" result="edge"/>
      <feMerge>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#keyline)">
    <g transform="translate(12 12) scale(0.84) translate(-12 -12)">
    <path d="M12.6 1.8C12.6 1.8 6.2 5.4 6.2 12.6C6.2 17 8.8 20.6 12.4 20.6C16 20.6 18.6 17 18.6 12.6C18.6 9.6 16.4 6.6 16.4 6.6C16.4 9.6 14.6 11.2 14.6 11.2C14.6 7.6 12.6 1.8 12.6 1.8Z" fill="url(#g)"/>
    <path d="M12.2 10.4C12.2 10.4 9.4 12.6 9.4 15.2C9.4 17.3 10.7 19 12.3 19C13.9 19 15.2 17.3 15.2 15.2C15.2 13.4 12.2 10.4 12.2 10.4Z" fill="url(#g2)"/>
    </g>
  </g>
</svg>
